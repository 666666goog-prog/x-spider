name: Build Windows Test Package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PNPM
        uses: pnpm/action-setup@v3
      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: pnpm i
      - name: Build
        run: pnpm tauri build
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: X-Spider-v2.3.9-Windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Pack portable version
        shell: pwsh
        run: |
          $portableDir = "portable/X-Spider-v2.3.9-Portable"
          New-Item -ItemType Directory -Force $portableDir | Out-Null
          Copy-Item "src-tauri/target/release/x-spider.exe" $portableDir
          Copy-Item "src-tauri/binaries/aria2c-x86_64-pc-windows-msvc.exe" "$portableDir/aria2c.exe"
          New-Item -ItemType File -Force "$portableDir/portable.txt" | Out-Null
          Compress-Archive -Path $portableDir -DestinationPath "X-Spider-v2.3.9-Portable.zip"
      - name: Upload portable version
        uses: actions/upload-artifact@v4
        with:
          name: X-Spider-v2.3.9-Portable
          path: X-Spider-v2.3.9-Portable.zip
          if-no-files-found: error
